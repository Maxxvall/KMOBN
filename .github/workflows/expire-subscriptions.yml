name: Expire subscriptions

on:
  schedule:
    - cron: '0 21 * * *'

jobs:
  expire:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger expiration job
        run: |
          curl -X POST "${{ secrets.EXPIRE_SUBSCRIPTIONS_URL }}" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${{ secrets.EXPIRE_SUBSCRIPTIONS_TOKEN }}"